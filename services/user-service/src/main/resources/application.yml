# user-service — profiles, KYC tiers (MOCK verification), bank accounts, beneficiaries.
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/user_db
    username: user_svc
    password: ${SERVICE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/common
    # shared db/common migrations (idempotent) may be added after a service's own V1+
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

payverse:
  # External providers: adapter = real integration (or mock); mode = stub (default responses, no network) | live
  providers:
    kyc:
      adapter: ${KYC_ADAPTER:setu}
      mode: ${KYC_MODE:${PROVIDERS_MODE:stub}}
      base-url: ${SETU_BASE_URL:https://dg-sandbox.setu.co}
      credentials:
        client-id: ${SETU_CLIENT_ID:}
        client-secret: ${SETU_CLIENT_SECRET:}
        product-instance-id: ${SETU_PRODUCT_INSTANCE_ID:}
    document-storage:
      adapter: ${DOCUMENT_STORAGE_ADAPTER:s3}
      mode: ${DOCUMENT_STORAGE_MODE:${PROVIDERS_MODE:stub}}
      base-url: ${S3_BUCKET_ENDPOINT:https://payverse-kyc-documents.s3.ap-south-1.amazonaws.com}
      credentials:
        access-key-id: ${AWS_ACCESS_KEY_ID:}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
        region: ${AWS_REGION:ap-south-1}
        bucket: ${S3_BUCKET:payverse-kyc-documents}
  security:
    jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: payverse
  crypto:
    key-id: ${PAYVERSE_CRYPTO_KEY_ID:v1}
    encryption-key: ${PAYVERSE_CRYPTO_ENCRYPTION_KEY}
    blind-index-key: ${PAYVERSE_CRYPTO_BLIND_INDEX_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      customizer: com.payverse.common.web.masking.PiiMaskingLogCustomizer
  level:
    root: INFO
    com.payverse: INFO
