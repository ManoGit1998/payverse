# auth-service — mobile + OTP login, RS256 JWT/JWKS, refresh rotation, devices, transaction PIN.
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/auth_db
    username: auth_svc
    password: ${SERVICE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/common
    # shared db/common migrations (idempotent) may be added after a service's own V1+
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

payverse:
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp:
      sender: ${OTP_SENDER:log}     # MOCK LogOtpSender in dev — see README
      ttl: 5m
      length: 6
      max-requests: 3
      request-window: 10m
    admin-mobiles: ${ADMIN_MOBILES:}
    support-mobiles: ${SUPPORT_MOBILES:}
    service-token-ttl: 5m
    service-clients:
      - { id: api-gateway, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: user-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: wallet-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: transaction-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: payment-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: bill-payment-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: rewards-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: notification-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: fraud-risk-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: reconciliation-service, secret: "${SERVICE_CLIENT_SECRET:}" }
      - { id: admin-service, secret: "${SERVICE_CLIENT_SECRET:}" }
  security:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: payverse
  crypto:
    key-id: ${PAYVERSE_CRYPTO_KEY_ID:v1}
    encryption-key: ${PAYVERSE_CRYPTO_ENCRYPTION_KEY}
    blind-index-key: ${PAYVERSE_CRYPTO_BLIND_INDEX_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      customizer: com.payverse.common.web.masking.PiiMaskingLogCustomizer
  level:
    root: INFO
    com.payverse: INFO
