# Creates every topic and its .dlt twin (idempotent); re-runs on each install/upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: payverse-kafka-topics-1
  labels:
    app.kubernetes.io/part-of: payverse
    app.kubernetes.io/instance: payverse
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: payverse-0.1.0
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: payverse
        app.kubernetes.io/instance: payverse
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: payverse-0.1.0
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.3.1
          command: ["/bin/bash", "/scripts/create-topics.sh"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "payverse-kafka:9092" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx128m" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources: { limits: { memory: 256Mi } }
      volumes:
        - name: scripts
          configMap: { name: payverse-kafka-topics }
