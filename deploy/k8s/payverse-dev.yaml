# Source: payverse/templates/infra/kafka.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payverse-kafka
  labels:
    app.kubernetes.io/part-of: payverse
    app.kubernetes.io/instance: payverse
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: payverse-0.1.0
spec:
  serviceName: payverse-kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: payverse, app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: payverse
        app.kubernetes.io/instance: payverse
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: payverse-0.1.0
        app.kubernetes.io/name: kafka
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - { name: CLUSTER_ID, value: payverse-k8s-kraft-01 }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://payverse-kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m" }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
