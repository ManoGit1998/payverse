apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payverse-postgres
  labels:
    app.kubernetes.io/part-of: payverse
    app.kubernetes.io/instance: payverse
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: payverse-0.1.0
spec:
  serviceName: payverse-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: payverse, app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: payverse
        app.kubernetes.io/instance: payverse
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: payverse-0.1.0
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: ["-c", "shared_buffers=128MB", "-c", "max_connections=200", "-c", "work_mem=4MB"]
          env:
            - { name: POSTGRES_USER, value: "payverse" }
            - { name: POSTGRES_DB, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: payverse-secrets, key: POSTGRES_PASSWORD } }
            - name: SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payverse-secrets, key: SERVICE_DB_PASSWORD } }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d postgres"] }
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: payverse-postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
