# Source: payverse/templates/infra/redis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payverse-redis
  labels:
    app.kubernetes.io/part-of: payverse
    app.kubernetes.io/instance: payverse
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: payverse-0.1.0
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: payverse, app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: payverse
        app.kubernetes.io/instance: payverse
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: payverse-0.1.0
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8.8-alpine
          # noeviction: idempotency keys, OTPs and locks must never be silently evicted
          command: ["sh", "-c", "exec redis-server --maxmemory 200mb --maxmemory-policy noeviction --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: payverse-secrets, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"] }
            periodSeconds: 5
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
