apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payverse
  labels:
    app.kubernetes.io/part-of: payverse
    app.kubernetes.io/instance: payverse
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: payverse-0.1.0
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  ingressClassName: nginx
  rules:
    - host: "api.payverse.local"
      http:
        paths:
          # Only the gateway is exposed; /internal/** is never routed by it (and needs a SERVICE token anyway).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payverse-api-gateway
                port: { name: http }
