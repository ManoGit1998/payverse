{{- if .Values.infra.enabled }}
{{- $fullname := include "payverse.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        {{- include "payverse.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.infra.redis.image }}
          # noeviction: idempotency keys, OTPs and locks must never be silently evicted
          command: ["sh", "-c", "exec redis-server --maxmemory 200mb --maxmemory-policy noeviction --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "payverse.secretName" . }}, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"] }
            periodSeconds: 5
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
{{- end }}
