{{- if .Values.infra.enabled }}
{{- $fullname := include "payverse.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kafka
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-kafka
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels:
        {{- include "payverse.labels" . | nindent 8 }}
        app.kubernetes.io/name: kafka
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          env:
            - { name: CLUSTER_ID, value: payverse-k8s-kraft-01 }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ $fullname }}-kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m" }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.infra.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.infra.kafka.storage }} } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-kafka-topics
  labels: {{- include "payverse.labels" . | nindent 4 }}
data:
  create-topics.sh: |-
{{ .Files.Get "files/create-topics.sh" | indent 4 }}
---
# Creates every topic and its .dlt twin (idempotent); re-runs on each install/upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-kafka-topics-{{ .Release.Revision }}
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "payverse.labels" . | nindent 8 }}
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: {{ .Values.infra.kafka.image }}
          command: ["/bin/bash", "/scripts/create-topics.sh"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "{{ $fullname }}-kafka:9092" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx128m" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources: { limits: { memory: 256Mi } }
      volumes:
        - name: scripts
          configMap: { name: {{ $fullname }}-kafka-topics }
{{- end }}
