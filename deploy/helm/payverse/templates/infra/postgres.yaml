{{- if .Values.infra.enabled }}
{{- $fullname := include "payverse.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-postgres-init
  labels: {{- include "payverse.labels" . | nindent 4 }}
data:
  01-create-databases.sh: |-
{{ .Files.Get "files/01-create-databases.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels: {{- include "payverse.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels:
        {{- include "payverse.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          args: ["-c", "shared_buffers=128MB", "-c", "max_connections=200", "-c", "work_mem=4MB"]
          env:
            - { name: POSTGRES_USER, value: {{ .Values.infra.postgres.user | quote }} }
            - { name: POSTGRES_DB, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "payverse.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "payverse.secretName" . }}, key: SERVICE_DB_PASSWORD } }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d postgres"] }
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: {{ $fullname }}-postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.infra.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.infra.postgres.storage }} } }
{{- end }}
