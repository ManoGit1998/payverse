{{- if not .Values.secrets.existingSecret }}
{{- $name := include "payverse.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $data := dict -}}
{{- if $existing }}{{- $data = $existing.data -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "payverse.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # generated keys must survive uninstall/upgrade (encrypted PII depends on them)
type: Opaque
data:
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  SERVICE_DB_PASSWORD: {{ get $data "SERVICE_DB_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  REDIS_PASSWORD: {{ get $data "REDIS_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  SERVICE_CLIENT_SECRET: {{ get $data "SERVICE_CLIENT_SECRET" | default (randAlphaNum 48 | b64enc) }}
  # AES-256 / HMAC keys: base64 of 32 random bytes (the apps decode them), stored base64 again by Kubernetes
  PAYVERSE_CRYPTO_ENCRYPTION_KEY: {{ get $data "PAYVERSE_CRYPTO_ENCRYPTION_KEY" | default (randAlphaNum 32 | b64enc | b64enc) }}
  PAYVERSE_CRYPTO_BLIND_INDEX_KEY: {{ get $data "PAYVERSE_CRYPTO_BLIND_INDEX_KEY" | default (randAlphaNum 32 | b64enc | b64enc) }}
  ADMIN_MOBILES: {{ .Values.secrets.adminMobiles | b64enc }}
  SUPPORT_MOBILES: {{ .Values.secrets.supportMobiles | b64enc }}
{{- end }}
