{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "payverse.fullname" . }}
  labels: {{- include "payverse.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the gateway is exposed; /internal/** is never routed by it (and needs a SERVICE token anyway).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "payverse.fullname" . }}-api-gateway
                port: { name: http }
{{- end }}
