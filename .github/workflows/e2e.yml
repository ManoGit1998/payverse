name: E2E

# The whole stack (infra + 12 services) in Docker on one runner, then make e2e's scenario:
# sign up two users, add money, transfer, pay a bill, verify every balance against the ledger.
on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest   # 4 vCPU / 16 GB: the stack needs ~9 GB
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate .env with random secrets
        run: make env
      - name: make e2e
        run: make e2e
      - name: Container status and logs
        if: failure()
        run: |
          docker compose --profile infra --profile core --profile payments --profile extras ps
          for c in $(docker ps -a --filter label=com.docker.compose.project=payverse --format '{{.Names}}'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1; echo "::endgroup::"
          done
      - name: Stop the stack
        if: always()
        run: make infra-down
